<body><div class="app"><header class="top"><div class="brand"><div class="mark">✚</div><div><b>ICU KAASH</b><small>CARE TODAY · SAFER TOMORROW</small></div></div><div class="shift">DAY SHIFT · 12 OCT</div></header><nav class="tabs"><button class="tab on" data-page="census">Census</button><button class="tab" data-page="patients">Patients</button><button class="tab" data-page="handover">Handover</button><button class="tab" data-page="team">Team</button></nav><main id="main"></main></div>

<script>
const groups=[{name:"ICU · General",ids:Array.from({length:20},(_,i)=>`ICU${String(i+1).padStart(2,"0")}`)},{name:"Isolation",ids:["ISO21","ISO22","ISO23","ISO24"]},{name:"CT-ICU",ids:["CT-ICU1","CT-ICU2"]},{name:"PICO",ids:["PICO1","PICO2"]}];

const patients=[{...blank("ICU01","ICU"),mrn:"DEMO-1001",name:"Sample Patient A",age:"64",gender:"M",nationality:"Saudi",gcs:"10",diagnosis:"Sepsis · demo",oxygen:"ETT / ventilator",iv:"CVC",void:"IFC / Foley",device:"Ventilator",icuPhysician:"Dr. A",primaryPhysician:"Dr. B",precautions:"Contact",feeding:"NGT feeding",doa:"12/10/2026",toa:"04:15",endorsement:"Monitor hemodynamics",sedated:"Yes",infusions:"Norepinephrine · demo",swab:"Blood culture",culture:"Pending"},{...blank("ICU02","ICU"),mrn:"DEMO-1002",name:"Sample Patient B",age:"51",gender:"F",nationality:"Saudi",gcs:"14",diagnosis:"Pneumonia · demo",oxygen:"HFNC",iv:"Peripheral line",void:"IFC / Foley",icuPhysician:"Dr. C",primaryPhysician:"Dr. D",feeding:"Oral",doa:"11/10/2026",toa:"21:10",infusions:"Maintenance fluid · demo",pi:"Heel · stage 1",swab:"Sputum",culture:"Pending"},{...blank("ICU03","ICU"),mrn:"DEMO-1003",name:"Sample Patient C",age:"72",gender:"M",nationality:"Other",code:"DNR",gcs:"7",diagnosis:"Stroke · demo",oxygen:"ETT / ventilator",iv:"Central line",void:"IFC / Foley",device:"Ventilator",icuPhysician:"Dr. A",primaryPhysician:"Dr. E",feeding:"NGT",doa:"10/10/2026",toa:"18:40",endorsement:"Family meeting planned",sedated:"Yes",infusions:"Sedation · demo",pi:"Sacrum · stage 1"},{...blank("ICU04","ICU"),mrn:"DEMO-1004",name:"Sample Patient D",age:"39",gender:"F",nationality:"Other",gcs:"15",diagnosis:"Post-operative monitoring",oxygen:"Nasal cannula",iv:"Peripheral line",device:"Drain",icuPhysician:"Dr. F",primaryPhysician:"Dr. B",feeding:"NPO"},{...blank("ISO21","Isolation"),mrn:"DEMO-1005",name:"Sample Patient E",age:"58",gender:"M",nationality:"Other",gcs:"12",diagnosis:"Respiratory infection · demo",oxygen:"Face mask",iv:"Peripheral line",void:"IFC / Foley",precautions:"Airborne",icuPhysician:"Dr. C",primaryPhysician:"Dr. G",endorsement:"Isolation precautions",swab:"Respiratory swab",culture:"Under review"},{...blank("CT-ICU1","CT-ICU"),mrn:"DEMO-1006",name:"Sample Patient F",age:"67",gen const staff=["Staff A","Staff B","Staff C","Staff D","Staff E","Staff F","Staff G","Staff H"],attendance={},assigned={ICU01:"Staff A",ICU02:"Staff B",ISO21:"Staff C"},acuity={ICU01:3,ICU02:2,ISO21:4},side={ICU01:"Code Blue",ICU03:"Dressing trolley"};let counts={transferIn:0,er:1,or:0,transferOut:0,referral:0,expired:0,dama:0,absconded:0,success:0,unsuccessful:0,pending:0},note="Review pending investigations and update the next shift.",page="census",selected=null,detailMode="profile";

function census(){let n=active().length;main.innerHTML=`<section class="hero"><div class="eyebrow">ICU SHIFT BOARD · DEMO UNIT</div><h2>Good morning, Charge Nurse</h2><p>Monday, 12 October 2026 · Day shift</p></section><div class="stats"><div class="stat"><span>OCCUPIED BEDS</span><strong>${n} / 28</strong></div><div class="stat"><span>AVAILABLE</span><strong>${28-n}</strong></div><div class="stat"><span>DNR</span><strong>${num(p=>p.code==="DNR")}</strong></div></div>${groups.map(g=>`<section class="section"><div class="secthead"><h3>${g.name}</h3><small>${g.ids.filter(id=>active().some(p=>p.bed===id)).length} / ${g.ids.length} occupied</small></div><div class="beds">${g.ids.map(id=>{let p=patients.find(x=>x.bed===id&&x.name);return `<button class="bed ${p?"taken":""}" data-bed="${id}"><b>${id}${p?'<i class="dot"></i>':"＋"}</b><small>${p?safe(p.name):"Available"}</small></button>`}).join("")}</div></section>`).join("")}<div class="fine">Try a bed, patient, handover counter, or staff assignment. Demo values only.</div>`;main.querySelectorAll("[data-bed]").forEach(b=>b.onclick=()=>{let p=patients.find(x=>x.bed===b.dataset.bed);if(!p){p=blank(b.dataset.bed,groups.find(g=>g.ids.includes(b.dataset.bed)).name);p.name="New demo patient";p.mrn="DEMO-NEW";patients.push(p)}open(p)})}
function patientList(){main.innerHTML=`<h2 class="title">Patients</h2><p class="sub">Demographics, clinical overview, and daily care</p><input class="search" id="search" placeholder="Search bed, patient, MRN, or diagnosis"><div id="list"></div>`;let fill=q=>{$("#list").innerHTML=groups.flatMap(g=>g.ids).map(id=>patients.find(p=>p.bed===id)).filter(p=>p&&(`${p.name} ${p.mrn} ${p.bed} ${p.diagnosis}`).toLowerCase().includes(q.toLowerCase())).map(p=>`<article class="card"><div class="toprow"><div><div class="label">${p.bed} · ${p.unit}</div><h3>${safe(p.name||"Available bed")}</h3></div>${pill(p.name?p.code:"EMPTY",p.code==="DNR"?"red":"green")}</div><div class="meta">MRN ${safe(p.mrn)} · ${safe(p.age)} y · ${safe(p.gender)} · ${safe(p.nationality)}</div><div class="diagnosis">${safe(p.diagnosis)}</div><div>${pill(p.oxygen||"Oxygen —","blue")}${pill(p.precautions,p.precautions==="Standard"?"":"amber")}${p.cancelled==="Yes"?pill("CANCELLED","red"):""}</div><div class="meta">ICU ${safe(p.icuPhysician||"—")} · Primary ${safe(p.primaryPhysician||"—")}</div><p><button class="btn secondary" data-open="${p.bed}">Open details</button></p></article>`).join("")};fill("");$("#search").oninput=e=>fill(e.target.value);main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>open(patients.find(p=>p.bed===b.dataset.open)))}
function handover(){main.innerHTML=`<h2 class="title">Endorsement</h2><p class="sub">Shift summary · unit overview</p><div class="stats"><div class="stat"><span>TOTAL PATIENTS</span><strong>${active().length}</strong></div><div class="stat"><span>SAUDI</span><strong>${num(p=>p.nationality==="Saudi")}</strong></div><div class="stat"><span>NON-SAUDI</span><strong>${num(p=>p.nationality!=="Saudi")}</strong></div></div><section class="section"><div class="secthead"><h3>Patient categories</h3><small>Current census</small></div><div class="grid2">${metric("Medical",num(p=>p.patientType==="Medical"))}${metric("Surgical",num(p=>p.patientType==="Surgical"))}${metric("Bedridden",num(p=>p.device==="Ventilator"))}${metric("Pressure injury · total",num(p=>p.pi!=="None"))}</div></section><section class="section"><div class="secthead"><h3>Airway & respiratory support</h3></div><div class="grid2">${metric("ETT / tracheostomy",num(p=>/ETT|trach/i.test(p.oxygen)))}${metric("Tracheostomy ventilation",num(p=>/TV/i.test(p.oxygen)))}${metric("Face mask",num(p=>/face mask/i.test(p.oxygen)))}${metric("Venturi / NRFM",num(p=>/venturi|NRFM/i.test(p.oxygen)))}${metric("Nasal cannula",num(p=>/nasal cannula|NC/i.test(p.oxygen)))}${metric("HFNC",num(p=>/HFNC/i.test(p.oxygen)))}${metric("Room air / NIV / TM",num(p=>/room air|NIV|TM/i.test(p.oxygen)))}</div></section><section class="section"><div class="secthead"><h3>Lines & infection cases</h3></div><div class="grid2">${metric("Central line · CL",num(p=>/CVC|central/i.test(p.iv)))}${metric("Peripheral line · PL",num(p=>/peripheral/i.test(p.iv)))}${metric("Arterial line",num(p=>/arterial/i.test(p.iv)))}${metric("Foley · IFC",num(p=>/Foley|IFC/i.test(p.void)))}${metric("Contact",num(p=>p.precautions==="Contact"))}${metric("Airborne",num(p=>p.precautions==="Airborne"))}${metric("Droplet",num(p=>p.precautions==="Droplet"))}${metric("Total infection cases",num(p=>["Contact","Airborne","Droplet"].includes(p.precautions)))}</div></section><section class="section"><div class="secthead"><h3>Pressure injury</h3></div><div class="grid2">${metric("ICU",num(p=>p.pi!=="None"))}${metric("Ward",0)}${metric("Home",0)}${metric("Total",num(p=>p.pi!=="None"))}</div></section><section class="section"><div class="secthead"><h3>DNR register · bed and MRN</h3></div>${active().filter(p=>p.code==="DNR").map(p=>`<div class="row"><b>${p.bed} · ${safe(p.mrn)}</b>${pill(p.dnrSystem,"red")}</div>`).join("")||'<span class="meta">No demo DNR cases</span>'}<div class="grid2">${metric("Total DNR",num(p=>p.code==="DNR"))}${metric("Paper system",num(p=>p.code==="DNR"&&p.dnrSystem==="Paper"))}${metric("Electronic system",num(p=>p.code==="DNR"&&p.dnrSystem==="Electronic"))}</div></section><section class="section"><div class="secthead"><h3>Arrest events</h3></div><div class="grid2">${metric("Successful",counts.success)}${metric("Unsuccessful",counts.unsuccessful)}</div><button class="btn secondary" data-count="success">＋ Successful</button> <button class="btn secondary" data-count="unsuccessful">＋ Unsuccessful</button></section><section class="section"><h3>Admission</h3><div class="grid2">${metric("Transfer-in",counts.transferIn)}${metric("ER",counts.er)}${metric("OR",counts.or)}</div>${[["transferIn","＋ Transfer-in"],["er","＋ ER"],["or","＋ OR"]].map(([k,l])=>`<button class="btn secondary" data-count="${k}">${l}</button>`).join(" ")}</section><section class="section"><h3>Discharge</h3><div class="grid2">${metric("Transfer-out",counts.transferOut)}${metric("Referral",counts.referral)}${metric("Expired",counts.expired)}${metric("DAMA",counts.dama)}${metric("Absconded",counts.absconded)}</div>${["transferOut","referral","expired","dama","absconded"].map(k=>`<button class="btn secondary" data-count="${k}">＋ ${k}</button>`).join(" ")}</section><section class="section"><h3>Held / cancelled / outside cases</h3><div class="grid2">${metric("Held beds",num(p=>!!p.holdReason))}${metric("Cancelled",num(p=>p.cancelled==="Yes"))}${metric("Pending cases outside function team(){let status=["On Duty","Absent","On-call","Pull-out","FO"];main.innerHTML=`<h2 class="title">Staff assignment</h2><p class="sub">Day shift · 12 October 2026</p><section class="section"><div class="secthead"><h3>Charge nurse</h3><small>Shift lead</small></div><select class="search"><option>Charge Nurse A</option><option>Charge Nurse B</option></select></section><div class="assignment">${active().map(p=>`<article class="assign"><b>${p.bed} · ${safe(p.name)}</b><select data-staff="${p.bed}">${staff.map(x=>`<option ${assigned[p.bed]===x?"selected":""}>${x}</option>`).join("")}</select><div class="label" style="margin-top:7px">ACUITY</div><div class="acuity">${[1,2,3,4,5].map(n=>`<button class="${acuity[p.bed]===n?"on":""}" data-acuity="${p.bed}" data-value="${n}">${n}</button>`).join("")}</div><select data-task="${p.bed}">${["None","Dressing trolley","Code Blue","RRT","Med trolley","ECG / US","Crash cart 1/2","CSSD"].map(x=>`<option ${side[p.bed]===x?"selected":""}>${x}</option>`).join("")}</select></article>`).join("")}</div><section class="section"><div class="secthead"><h3>Staff attendance</h3><small>${staff.length} total</small></div><div class="attendance">${staff.map(n=>`<div class="att"><b>${n}</b><select data-att="${n}">${status.map(x=>`<option ${((attendance[n]||"On Duty")===x)?"selected":""}>${x}</option>`).join("")}</select></div>`).join("")}</div><div class="grid2" style="margin-top:8px">${metric("Absent",staff.filter(n=>attendance[n]==="Absent").length)}${metric("On-call",staff.filter(n=>attendance[n]==="On-call").length)}${metric("Pull-out",staff.filter(n=>attendance[n]==="Pull-out").length)}${metric("FO",staff.filter(n=>attendance[n]==="FO").length)}</div></section><section class="section"><h3>Side task options</h3><p>${["Dressing trolley","Code Blue","RRT","Med trolley","ECG / US","Crash cart","CSSD"].map(x=>pill(x,"blue")).join("")}</p></section>`;main.querySelectorAll("[data-staff]").forEach(x=>x.onchange=()=>assigned[x.dataset.staff]=x.
