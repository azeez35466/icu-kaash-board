const blank=(bed,unit)=>({bed,unit,code:"FULL",mrn:"",name:"",age:"",dob:"",gender:"",nationality:"",admissionSource:"",patientType:"Medical",reasonForICU:"",medicalHistory:"",surgicalHistory:"",allergies:"",weight:"",height:"",gcs:"",diagnosis:"",secondaryDiagnosis:"",oxygen:"",airway:"",ventMode:"",fio2:"",peep:"",tidalVolume:"",respiratoryRate:"",spo2:"",heartRate:"",bloodPressure:"",map:"",rhythm:"",hemodynamicNotes:"",iv:"",void:"",urineOutput:"",device:"",icuPhysician:"",primaryPhysician:"",precautions:"Standard",feeding:"",diet:"",doa:"",toa:"",labs:"",piStage:"None",braden:"",wounds:"",pupils:"",painScore:"",rass:"",endorsement:"",holdReason:"",cancelled:"No",cancelledBy:"",sedated:"No",infusions:"",pi:"None",swab:"",culture:"",panic:"—",corrected:"No",patientType:"Medical",dnrSystem:"Paper"});
const patients=[{...blank("ICU01","ICU"),mrn:"DEMO-1001",name:"Sample Patient A",age:"64",gender:"M",nationality:"Saudi",gcs:"10",diagnosis:"Sepsis · demo",oxygen:"ETT / ventilator",iv:"CVC",void:"IFC / Foley",device:"Ventilator",icuPhysician:"Dr. A",primaryPhysician:"Dr. B",precautions:"Contact",feeding:"NGT feeding",doa:"12/10/2026",toa:"04:15",endorsement:"Monitor hemodynamics",sedated:"Yes",infusions:"Norepinephrine · demo",swab:"Blood culture",culture:"Pending"},{...blank("ICU02","ICU"),mrn:"DEMO-1002",name:"Sample Patient B",age:"51",gender:"F",nationality:"Saudi",gcs:"14",diagnosis:"Pneumonia · demo",oxygen:"HFNC",iv:"Peripheral line",void:"IFC / Foley",icuPhysician:"Dr. C",primaryPhysician:"Dr. D",feeding:"Oral",doa:"11/10/2026",toa:"21:10",infusions:"Maintenance fluid · demo",pi:"Heel · stage 1",swab:"Sputum",culture:"Pending"},{...blank("ICU03","ICU"),mrn:"DEMO-1003",name:"Sample Patient C",age:"72",gender:"M",nationality:"Other",code:"DNR",gcs:"7",diagnosis:"Stroke · demo",oxygen:"ETT / ventilator",iv:"Central line",void:"IFC / Foley",device:"Ventilator",icuPhysician:"Dr. A",primaryPhysician:"Dr. E",feeding:"NGT",doa:"10/10/2026",toa:"18:40",endorsement:"Family meeting planned",sedated:"Yes",infusions:"Sedation · demo",pi:"Sacrum · stage 1"},{...blank("ICU04","ICU"),mrn:"DEMO-1004",name:"Sample Patient D",age:"39",gender:"F",nationality:"Other",gcs:"15",diagnosis:"Post-operative monitoring",oxygen:"Nasal cannula",iv:"Peripheral line",device:"Drain",icuPhysician:"Dr. F",primaryPhysician:"Dr. B",feeding:"NPO"},{...blank("ISO21","Isolation"),mrn:"DEMO-1005",name:"Sample Patient E",age:"58",gender:"M",nationality:"Other",gcs:"12",diagnosis:"Respiratory infection · demo",oxygen:"Face mask",iv:"Peripheral line",void:"IFC / Foley",precautions:"Airborne",icuPhysician:"Dr. C",primaryPhysician:"Dr. G",endorsement:"Isolation precautions",swab:"Respiratory swab",culture:"Under review"},{...blank("CT-ICU1","CT-ICU"),mrn:"DEMO-1006",name:"Sample Patient F",age:"67",gen const $=s=>document.querySelector(s),main=$("#main"),safe=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),active=()=>patients.filter(p=>p.name),num=fn=>active().filter(fn).length,pill=(v,c="")=>`<span class="pill ${c}">${safe(v)}</span>`,metric=(n,v)=>`<div class="metric"><b>${safe(v)}</b><small>${safe(n)}</small></div>`;

function census(){let n=active().length;main.innerHTML=`<section class="hero"><div class="eyebrow">ICU SHIFT BOARD</div><h2>Good morning, Charge Nurse</h2><p>Monday, 12 October 2026 · Day shift</p></section><div class="stats"><div class="stat"><span>OCCUPIED BEDS</span><strong>${n} / 28</strong></div><div class="stat"><span>AVAILABLE</span><strong>${28-n}</strong></div><div class="stat"><span>DNR</span><strong>${num(p=>p.code==="DNR")}</strong></div></div>${groups.map(g=>`<section class="section"><div class="secthead"><h3>${g.name}</h3><small>${g.ids.filter(id=>active().some(p=>p.bed===id)).length} / ${g.ids.length} occupied</small></div><div class="beds">${g.ids.map(id=>{let p=patients.find(x=>x.bed===id&&x.name);return `<button class="bed ${p?"taken":""}" data-bed="${id}"><b>${id}${p?'<i class="dot"></i>':"＋"}</b><small>${p?safe(p.name):"Available"}</small></button>`}).join("")}</div></section>`).join("")}<div class="fine">Select a bed to view a patient. Use Schedule for staff assignments.</div>`;main.querySelectorAll("[data-bed]").forEach(b=>b.onclick=()=>{let p=patients.find(x=>x.bed===b.dataset.bed);if(!p){p=blank(b.dataset.bed,groups.find(g=>g.ids.includes(b.dataset.bed)).name);p.name="";p.mrn="";patients.push(p)}open(p)})}
function patientList(){
 main.innerHTML=`<h2 class="title">Patients</h2><p class="sub">Compact shift overview · tap a patient for details</p><input class="search" id="search" placeholder="Search bed, patient, MRN, or diagnosis" aria-label="Search patients"><div id="list"></div>`;
 const list=document.getElementById('list');
 function fill(q=''){
  const term=q.trim().toLowerCase();
  const matches=groups.flatMap(g=>g.ids).map(id=>patients.find(p=>p.bed===id)).filter(p=>p&&(`${p.name||''} ${p.mrn||''} ${p.bed||''} ${p.diagnosis||''}`).toLowerCase().includes(term));
  list.innerHTML=matches.map(p=>{
   const lines=Array.isArray(p.lines)?p.lines:[];
   const svcs=Array.isArray(p.admissionServices)?p.admissionServices:[];
   const infusions=svcs.filter(v=>v.type==='Infusion').map(v=>v.details).filter(Boolean);
   const pending=p.pendingNursingTasks||'';
   const airway=p.oxygenType||p.oxygen||p.respiratorySupport||'Not documented';
   return `<article class="card"><div class="toprow"><div><div class="label">${safe(p.bed)} · ${safe(p.unit||'ICU')}</div><h3>${safe(p.name||'Available bed')}</h3></div>${pill(p.name?p.code:'EMPTY',p.code==='DNR'?'red':'green')}</div><div class="meta">MRN ${safe(p.mrn||'—')} · ${safe(p.age||'—')} y · ${safe(p.gender||'—')}</div><div class="diagnosis">${safe(p.diagnosis||'Diagnosis not documented')}</div><div>${pill(airway,'blue')}${p.precautions?pill(p.precautions,'amber'):''}</div><div class="meta">ICU ${safe(p.icuPhysician||'—')} · Primary ${safe(p.primaryPhysician||'—')}</div><div class="meta" style="margin-top:7px"><b>Lines:</b> ${safe(lines.length?lines.map(d=>[d.name,d.site].filter(Boolean).join(' ')).join(' · '):'Not documented')}</div><div class="meta"><b>Infusions:</b> ${safe(infusions.length?infusions.join(' · '):'Not documented')}</div>${pending?`<div class="meta" style="margin-top:5px"><b>Pending:</b> ${safe(pending)}</div>`:''}<p><button class="btn secondary" data-open="${safe(p.bed)}">Open details</button></p></article>`;
  }).join('')||'<p class="sub">No matching beds found.</p>';
  list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(patients.find(p=>p.bed===b.dataset.open)));
 }
 fill();document.getElementById('search').addEventListener('input',e=>fill(e.target.value));
}
function handover(){main.innerHTML=`<h2 class="title">Endorsement</h2><p class="sub">Shift summary · unit overview</p><div class="stats"><div class="stat"><span>TOTAL PATIENTS</span><strong>${active().length}</strong></div><div class="stat"><span>SAUDI</span><strong>${num(p=>p.nationality==="Saudi")}</strong></div><div class="stat"><span>NON-SAUDI</span><strong>${num(p=>p.nationality!=="Saudi")}</strong></div></div><section class="section"><div class="secthead"><h3>Patient categories</h3><small>Current census</small></div><div class="grid2">${metric("Medical",num(p=>p.patientType==="Medical"))}${metric("Surgical",num(p=>p.patientType==="Surgical"))}${metric("Bedridden",num(p=>p.device==="Ventilator"))}${metric("Pressure injury · total",num(p=>p.pi!=="None"))}</div></section><section class="section"><div class="secthead"><h3>Airway & respiratory support</h3></div><div class="grid2">${metric("ETT / tracheostomy",num(p=>/ETT|trach/i.test(p.oxygen)))}${metric("Tracheostomy ventilation",num(p=>/TV/i.test(p.oxygen)))}${metric("Face mask",num(p=>/face mask/i.test(p.oxygen)))}${metric("Venturi / NRFM",num(p=>/venturi|NRFM/i.test(p.oxygen)))}${metric("Nasal cannula",num(p=>/nasal cannula|NC/i.test(p.oxygen)))}${metric("HFNC",num(p=>/HFNC/i.test(p.oxygen)))}${metric("Room air / NIV / TM",num(p=>/room air|NIV|TM/i.test(p.oxygen)))}</div></section><section class="section"><div class="secthead"><h3>Lines & infection cases</h3></div><div class="grid2">${metric("Central line · CL",num(p=>/CVC|central/i.test(p.iv)))}${metric("Peripheral line · PL",num(p=>/peripheral/i.test(p.iv)))}${metric("Arterial line",num(p=>/arterial/i.test(p.iv)))}${metric("Foley · IFC",num(p=>/Foley|IFC/i.test(p.void)))}${metric("Contact",num(p=>p.precautions==="Contact"))}${metric("Airborne",num(p=>p.precautions==="Airborne"))}${metric("Droplet",num(p=>p.precautions==="Droplet"))}${metric("Total infection cases",num(p=>["Contact","Airborne","Droplet"].includes(p.precautions)))}</div></section><section class /* Live local shift date: prevents stale hard-coded header dates. */
(function(){
  function refreshShiftDate(){
    const badge=document.querySelector('.top .shift');
    if(!badge)return;
    const now=new Date();
    const hour=now.getHours();
    const shift=hour>=7&&hour<15?'MORNING':hour>=15&&hour<23?'EVENING':'NIGHT';
    const date=new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(now).toUpperCase();
    badge.textContent=shift+' SHIFT · '+date;
    badge.title='Local device time';
  }
  refreshShiftDate();
  setInterval(refreshShiftDate,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshShiftDate()});
})();
